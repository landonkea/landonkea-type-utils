name: Release

# Fires when a stable version tag is pushed, e.g. v1.3.0. Skips
# release-candidate tags (they're handled by prerelease.yml) and refuses
# to publish unless the tag actually sits on main, stable releases only
# come from main.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    if: "!contains(github.ref, '-rc')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is reachable from main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "This tag's commit isn't on main. Stable releases must be tagged from main."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Set package.json version to match tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          npm pkg set version="$TAG"

      - name: Publish to npm (latest tag)
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
