name: Prerelease

# Fires when a release-candidate tag is pushed, e.g. v1.3.0-rc.1.
# Publishes to npm under the "next" dist-tag so `npm install` still
# resolves to the last stable version; only `npm install pkg@next`
# picks this up. Also creates a pre-release on GitHub.
on:
  push:
    tags:
      - 'v*.*.*-rc.*'

jobs:
  prerelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Set package.json version to match tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          npm pkg set version="$TAG"

      - name: Publish to npm (next tag)
        run: npm publish --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
